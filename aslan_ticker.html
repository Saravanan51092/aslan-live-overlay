<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ASLAN Live Ticker</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
}

.ticker {
    width: 100%;
    height: 60px;
    background: rgba(0,0,0,0.75);
    display: flex;
    align-items: center;
    overflow: hidden;
}

.ticker-text {
    white-space: nowrap;
    font-family: Arial, sans-serif;
    font-size: 30px;
    font-weight: bold;
    color: white;
    animation: scroll 18s linear infinite;
}

@keyframes scroll {
    from {
        transform: translateX(100vw);
    }

    to {
        transform: translateX(-100%);
    }
}
</style>
</head>

<body>

<div class="ticker">
    <div class="ticker-text">
        🦁 ASLAN LIVE • HUNT AS ONE • 🔥 CLAN RECRUITMENT OPEN • BEGINNERS • INTERMEDIATE • PRO PLAYERS WELCOME • SUBSCRIBE & JOIN THE HUNT 🦁
    </div>
</div>

</body>
</html>
